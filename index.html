<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Bardo OS</title>
  <meta name="description" content="An offline reading instrument for the Bardo Thödröl — The Great Liberation Upon Hearing in the Intermediate State." />
  <meta name="theme-color" content="#171412" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png" />
  <!-- iOS reads none of the manifest before 16.4 and still takes its
       home-screen label from here: without these an installed Bardo OS
       lands as a Safari bookmark called by the page title. -->
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Bardo OS" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/intro.css" />
  <link rel="preload" href="assets/intro/mandala.webp" as="image" type="image/webp" />
</head>
<body>

  <!-- The intro veil: the mandala arises and abides — turning, breathing —
       until tapped, then dissolves into the app. Decorative only —
       js/intro.js drives it and removes it; a tap or key opens the door. -->
  <div id="intro" aria-hidden="true">
    <div class="intro-glow"></div>
    <div class="intro-disc"></div>
    <div class="intro-label">BARDO OS</div>
    <div class="intro-cta">OPEN TO EXPLORE</div>
    <div class="intro-grain"></div>
  </div>

  <header class="app-header">
    <button class="menu-toggle" id="btnMenu" aria-expanded="false" aria-controls="nav">
      Texts
      <svg class="menu-caret" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <h1><button class="home-link" id="btnHome" type="button">Bardo OS</button></h1>
    <div class="header-actions">
      <a class="donate-link" href="https://www.paypal.com/donate/?business=JZS5LVZKPPY5J&amp;no_recurring=0&amp;item_name=Help+fund+Dharma+translation+projects.&amp;currency_code=USD" target="_blank" rel="noopener">Donate</a>
      <div class="lang-select" id="langSelect">
        <button class="lang-select-btn" id="btnUiLang" aria-haspopup="true" aria-expanded="false" aria-label="Interface language">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          <span class="lang-code" id="uiLangCode">ENG</span>
          <svg class="menu-caret" width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <ul class="lang-menu" id="uiLangMenu" role="menu" hidden></ul>
      </div>
    </div>
  </header>

  <nav class="nav" id="nav" aria-label="Texts of the cycle"></nav>

  <div class="shell">
    <main class="reader" id="reader"></main>
  </div>

  <div class="bottom-bar">

    <!-- The invitation to keep the app on the phone. Asked once, on the
         doorway only — never over an open text, and never over a
         deathbed. Whatever the reader answers is remembered for good:
         js/install.js reveals this and never brings it back. -->
    <div class="install-invite" id="installInvite" hidden>
      <svg class="install-invite-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="9.2"/><circle cx="12" cy="12" r="5.6"/><circle cx="12" cy="12" r="2"/></svg>
      <div class="install-invite-body">
        <p class="install-invite-title" id="installTitle"></p>
        <p class="install-invite-note" id="installNote"></p>
      </div>
      <button class="install-invite-action" id="btnInstall" type="button" hidden></button>
      <button class="install-invite-close" id="btnInstallClose" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
      </button>
    </div>

    <!-- The way back, while the reader is somewhere a link sent them.
         It sits above the controls, within thumb's reach at any scroll
         position, and says where it goes — returning lands on the exact
         passage they left, not the top of the text. -->
    <div class="return-bar" id="returnBar" hidden>
      <button class="return-link" id="btnReturn" type="button">
        <svg class="return-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        <span class="return-link-label" id="returnLabel">Back to</span>
        <span class="return-link-title" id="returnTitle"></span>
      </button>
    </div>

    <div class="bar-inner">

      <div class="bar-group" id="scrollGroup" role="group" aria-label="Auto-scroll">
        <button class="bar-btn" id="btnSlower" aria-label="Scroll slower">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <button class="bar-btn" id="btnPlay" aria-label="Start or pause auto-scroll" aria-pressed="false">
          <svg id="iconPlay" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          <svg id="iconPause" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
        </button>
        <button class="bar-btn" id="btnFaster" aria-label="Scroll faster">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>

      <div class="bar-group" id="modeGroup" role="group" aria-label="Reading mode">
        <button class="bar-btn btn-voice" id="btnVoice" aria-label="Voice mode — only the spoken layers" aria-pressed="false">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="7" y="7" width="10" height="10" transform="rotate(45 12 12)"/></svg>
        </button>
        <button class="bar-btn" id="btnFs" aria-label="Enter or leave fullscreen" aria-pressed="false">
          <svg id="iconExpand" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/><path d="M8 21H5a2 2 0 0 1-2-2v-3"/></svg>
          <svg id="iconCompress" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M16 3v3a2 2 0 0 0 2 2h3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/><path d="M8 21v-3a2 2 0 0 0-2-2H3"/></svg>
        </button>
        <button class="bar-btn" id="btnTheme" aria-label="Day or night">
          <svg id="iconSun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg id="iconMoon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>

      <div class="bar-group" id="contentsGroup" role="group" aria-label="Contents" hidden>
        <button class="bar-btn" id="btnContents" aria-haspopup="dialog" aria-expanded="false" aria-controls="contentsPanel" aria-label="Contents — jump to a part of this text">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        </button>
      </div>

      <div class="bar-group lang-group" role="group" aria-label="Layers shown">
        <button class="bar-btn bar-btn-text" id="btnBo" aria-pressed="true">TIB</button>
        <button class="bar-btn bar-btn-text" id="btnPhon" aria-pressed="true">PHO</button>
        <button class="bar-btn bar-btn-text" id="btnEn" aria-pressed="true">ENG</button>
      </div>

      <div class="bar-group" id="sizeGroup" role="group" aria-label="Text size">
        <button class="bar-btn" id="btnSmaller" aria-label="Smaller text">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
        </button>
        <button class="bar-btn" id="btnLarger" aria-label="Larger text">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
        </button>
      </div>

    </div>
  </div>

  <!-- Contents: jump to a major portion of the current text (the days of
       the Bardo of Reality, the instructions of the Bardo of Becoming…).
       Built from the rendered sections; opened from the bottom bar. -->
  <div class="contents-panel" id="contentsPanel" role="dialog" aria-modal="true" aria-labelledby="contentsHeading" hidden>
    <div class="contents-sheet" role="document">
      <h2 class="contents-heading" id="contentsHeading">Contents</h2>
      <ul class="contents-list" id="contentsList"></ul>
    </div>
  </div>

  <!-- The deity image, when one exists (BRIEF §7). Dormant until the
       owner supplies the roster: with no image in the manifest no plate
       is ever rendered and this never opens. An overlay, so the page
       beneath never moves — the reader comes back exactly where they
       were, and the auto-scroll is held while it is up. -->
  <div class="deity-viewer" id="deityViewer" role="dialog" aria-modal="true" aria-labelledby="deityViewerName" hidden>
    <div class="deity-sheet" role="document">
      <button class="deity-close" id="btnDeityClose" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
      </button>
      <img class="deity-viewer-image" id="deityViewerImage" alt="" />
      <h2 class="deity-viewer-name" id="deityViewerName"></h2>
      <p class="deity-viewer-credit" id="deityViewerCredit" hidden></p>
    </div>
  </div>

  <script type="module" src="js/intro.js"></script>
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/install.js"></script>
</body>
</html>
